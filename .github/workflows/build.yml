name: Build Fire TV app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed APK
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: |
          if [ -z "$WEB_APP_URL" ]; then echo "::warning::WEB_APP_URL secret is not set yet - the app will build but can't load chores."; fi
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk chore-chart.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chore Chart 1.0.${{ github.run_number }}
          files: chore-chart.apk
          make_latest: 'true'
