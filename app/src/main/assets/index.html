<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;background:#0f172a;color:#f1f5f9;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#parent .btn:active,#modal .btn:active,.tog:active,.chips button:active,.tabs button:active,.seg button:active{opacity:.6}
.saving{color:#94a3b8;font-size:13px;padding:0 6px}
.hidden{display:none!important}
.money{font-variant-numeric:tabular-nums}

/* ================= TV ================= */
#tv,#party{--u:1vw}
#tv{height:100vh;display:flex;flex-direction:column;padding:calc(1.6*var(--u)) calc(2*var(--u));gap:calc(1.2*var(--u));overflow:hidden;
  background:radial-gradient(circle at 20% 0%,#1e293b 0,#0f172a 60%)}
#tv header{display:flex;align-items:baseline;justify-content:space-between}
#tv h1{font-size:calc(2.6*var(--u));letter-spacing:.02em}
#tv .date{font-size:calc(1.6*var(--u));color:#94a3b8}
#tv .hint{font-size:calc(1.1*var(--u));color:#64748b}
.cols{flex:1;display:flex;gap:calc(1.6*var(--u));min-height:0}
.col{flex:1;display:flex;flex-direction:column;background:#1e293b;border-radius:calc(1.4*var(--u));overflow:hidden;
  border-top:calc(.6*var(--u)) solid var(--c);min-height:0}
.col-head{padding:calc(1*var(--u)) calc(1.2*var(--u)) calc(.6*var(--u));display:flex;justify-content:space-between;align-items:center}
.col-head h2{font-size:calc(2.3*var(--u))}
.stars{font-size:calc(1.5*var(--u));letter-spacing:calc(.1*var(--u));text-align:right;line-height:1.2}
.progress{font-size:calc(1.1*var(--u));color:#94a3b8;text-align:right}
.list{flex:1;overflow:hidden;padding:calc(.4*var(--u)) calc(1*var(--u));display:flex;flex-direction:column;gap:calc(.7*var(--u))}
.chore{display:flex;align-items:center;gap:calc(1*var(--u));padding:calc(.8*var(--u)) calc(1*var(--u));border-radius:calc(1*var(--u));background:#334155;
  border:calc(.3*var(--u)) solid transparent;text-align:left;width:100%}
.chore .ic{font-size:calc(2.4*var(--u));width:calc(3*var(--u));text-align:center}
.chore .nm{flex:1;font-size:calc(1.55*var(--u));font-weight:bold;line-height:1.15}
.chore .val{font-size:calc(1.3*var(--u));background:#0f172a;border-radius:calc(2*var(--u));padding:calc(.25*var(--u)) calc(.8*var(--u));color:#fde68a}
.chore .ck{width:calc(2.6*var(--u));height:calc(2.6*var(--u));border-radius:50%;border:calc(.25*var(--u)) solid #94a3b8;display:flex;align-items:center;
  justify-content:center;font-size:calc(1.6*var(--u));font-weight:bold}
.chore.done{background:#14532d}
.chore.done .nm{color:#bbf7d0}
.chore.done .ck{background:#22c55e;border-color:#22c55e;color:#fff}
.chore.focus{border-color:#fde047;background:#475569;outline:calc(.25*var(--u)) solid var(--c)}
.chore.done.focus{background:#166534}
.alldone{margin:0 calc(1*var(--u));padding:calc(.7*var(--u));border-radius:calc(1*var(--u));text-align:center;font-size:calc(1.5*var(--u));font-weight:bold;
  background:linear-gradient(90deg,#f59e0b,#fde047,#f59e0b);color:#422006}
.bank{display:grid;grid-template-columns:1fr 1fr 1fr;gap:calc(.6*var(--u));padding:calc(1*var(--u))}
.bank div{background:#0f172a;border-radius:calc(.8*var(--u));padding:calc(.6*var(--u)) calc(.4*var(--u));text-align:center}
.bank small{display:block;font-size:calc(.95*var(--u));color:#94a3b8}
.bank b{font-size:calc(1.6*var(--u))}
.bank .sv b{color:#86efac}.bank .sp b{color:#7dd3fc}.bank .wk b{color:#fde68a}
.empty{color:#64748b;font-size:calc(1.3*var(--u));text-align:center;padding:calc(2*var(--u))}

/* celebration */
#party{position:fixed;inset:0;background:rgba(15,23,42,.88);display:flex;align-items:center;justify-content:center;
  flex-direction:column;z-index:50;overflow:hidden}
#party h3{font-size:calc(5*var(--u));color:#fde047;text-shadow:0 calc(.3*var(--u)) 0 #a16207;text-align:center;animation:pop .6s ease-out}
#party p{font-size:calc(2.2*var(--u));margin-top:calc(1*var(--u));text-align:center}
#party .big{font-size:calc(9*var(--u));animation:spin 2.4s ease-in-out infinite}
.fall{position:absolute;top:-10vh;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(120vh)}}
.fall{will-change:transform}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes spin{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.15)}}

/* TV board shown on a phone */
#tv.phonetv{height:auto;min-height:100vh;overflow:visible;--u:2.4vw;padding:12px 10px 30px}
#tv.phonetv .cols{flex-direction:column}
#tv.phonetv .col{flex:none}
#tv.phonetv .list{overflow:visible}
#tv.phonetv header{flex-wrap:wrap;gap:6px}
#party.phonetv{--u:2.4vw}
@media (min-width:700px){#tv.phonetv,#party.phonetv{--u:1.15vw}#tv.phonetv .cols{flex-direction:row}}
.backbtn{display:inline-block;margin-bottom:10px;padding:10px 14px;border-radius:10px;background:#0ea5e9;color:#fff;font-weight:bold;font-size:15px}
.tvbtn{margin-top:10px}
/* toast */
#toast{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);background:#dc2626;color:#fff;padding:12px 20px;
  border-radius:10px;font-size:16px;z-index:99;max-width:90vw;text-align:center}
#toast.ok{background:#16a34a}

/* ================= PARENT (phone) ================= */
#parent{max-width:640px;margin:0 auto;padding:16px 14px 80px;font-size:16px}
#parent h1{font-size:22px;margin-bottom:4px}
.sub{color:#94a3b8;font-size:14px}
.tabs{display:flex;gap:6px;margin:14px 0;position:sticky;top:0;background:#0f172a;padding:6px 0;z-index:5}
.tabs button{flex:1;padding:10px 4px;border-radius:10px;background:#1e293b;font-weight:bold;font-size:14px}
.tabs button.on{background:#0ea5e9;color:#fff}
.card{background:#1e293b;border-radius:14px;padding:14px;margin-bottom:12px;border-left:6px solid var(--c,#0ea5e9)}
.card h2{font-size:19px;display:flex;justify-content:space-between;align-items:center}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.row3 div{background:#0f172a;border-radius:10px;padding:8px;text-align:center}
.row3 small{display:block;color:#94a3b8;font-size:12px}
.row3 b{font-size:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:10px;background:#334155;font-weight:bold;font-size:14px}
.btn.pri{background:#0ea5e9;color:#fff}.btn.grn{background:#16a34a;color:#fff}.btn.red{background:#b91c1c;color:#fff}
.btn.full{width:100%;padding:14px}
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #334155}
.li:last-child{border-bottom:0}
.li .ic{font-size:22px;width:28px;text-align:center}
.li .nm{flex:1}
.li .nm small{display:block;color:#94a3b8;font-size:12px}
.tog{width:30px;height:30px;border-radius:50%;border:2px solid #94a3b8;font-weight:bold}
.tog.on{background:#22c55e;border-color:#22c55e;color:#fff}
.off{opacity:.45}
.hist{font-size:14px}
.hist .amt{text-align:right;white-space:nowrap}
.pos{color:#86efac}.neg{color:#fca5a5}
label{display:block;font-size:13px;color:#94a3b8;margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#f1f5f9;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 10px;border-radius:8px;background:#334155;font-size:14px;font-weight:bold}
.chips button.on{background:#0ea5e9;color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40}
#modal .sheet{background:#1e293b;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px 0;max-height:94%;overflow:auto}
#modal .sheet>.btns:last-child,#modal .sheet>.btn.full:last-child{position:sticky;bottom:0;background:#1e293b;padding:12px 0 18px;margin-top:12px;z-index:2}
#modal h3{font-size:19px;margin-bottom:4px}
.pinbox{max-width:320px;margin:15vh auto;text-align:center}
.pinbox input{text-align:center;font-size:28px;letter-spacing:10px;margin:16px 0}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;background:#334155;font-weight:bold}
.seg button.on{background:#0ea5e9;color:#fff}
.loading{text-align:center;color:#94a3b8;padding:30vh 0;font-size:20px}
</style>
</head>
<body>
<div id="loading" class="loading">Loading chores…</div>
<div id="tv" class="hidden"></div>
<div id="parent" class="hidden"></div>
<div id="party" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script>
var MODE = '__MODE__';
// Inside the Fire TV app there is no google.script.run, so route calls through the app's native bridge
if (typeof google === 'undefined' && window.Native) {
  var __cbs = {}, __n = 0;
  window.__nativeCb = function (id, r) {
    var c = __cbs[id]; delete __cbs[id]; if (!c) return;
    if (r && r.ok) c.s(r.result); else c.f(new Error((r && r.error) || 'Network error'));
  };
  window.google = {script: {get run() {
    var s = function () {}, f = function () {};
    var o = {withSuccessHandler: function (x) { s = x; return o; }, withFailureHandler: function (x) { f = x; return o; }};
    ['getState', 'toggleChore', 'parent'].forEach(function (n) {
      o[n] = function () { var id = 'c' + (++__n); __cbs[id] = {s: s, f: f}; Native.call(id, n, JSON.stringify(Array.prototype.slice.call(arguments))); };
    });
    return o;
  }}};
}
  if (Native.mode) MODE = Native.mode();
var S = null;                 // state from server
var focus = {c: 0, r: 0};     // TV focus
var busy = false;
var pending = 0;              // chore taps still waiting on the server
var lastJson = '';
var tvView = false;            // parent looking at the TV board on a phone
var tvClicksBound = false;
var DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
var DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// ---------- server bridge ----------
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e); });
    r[fn].apply(r, args);
  });
}
function money(n) { n = Number(n) || 0; return (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg, ok) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = ok ? 'ok' : '';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'hidden'; }, 3200);
}
function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^Exception:\s*/, ''); }
function todayChores(k) { return k.chores.filter(function (c) { return c.today; }); }
function allDone(k) { var t = todayChores(k); return t.length > 0 && t.every(function (c) { return c.done; }); }
function earnedToday(k) { return todayChores(k).filter(function (c) { return c.done; }).reduce(function (s, c) { return s + c.value; }, 0); }

// ======================================================
// TV
// ======================================================
function renderTV() {
  var el = document.getElementById('tv');
  var d = new Date();
  var html = (tvView ? '<button class="backbtn" data-back="1">← Back to parent</button>' : '') +
    '<header><div><h1>⭐ Today\'s Chores</h1><div class="hint">' + (tvView ? 'This is what the kids see on the TV · tap a chore to check it' : 'Use ◀ ▶ ▲ ▼ to move · press OK to check off') + '</div></div>' +
    '<div class="date">' + DAY_NAMES[d.getDay()] + ', ' + d.toLocaleDateString(undefined, {month: 'long', day: 'numeric'}) + '</div></header><div class="cols">';
  S.kids.forEach(function (k, ci) {
    var list = todayChores(k);
    var n = list.filter(function (c) { return c.done; }).length;
    var stars = list.map(function (c) { return c.done ? '⭐' : '☆'; }).join('');
    html += '<section class="col" style="--c:' + esc(k.color) + '"><div class="col-head"><h2>' + esc(k.name) + '</h2>' +
      '<div><div class="stars">' + stars + '</div><div class="progress">' + n + ' of ' + list.length + ' done</div></div></div>';
    if (allDone(k)) html += '<div class="alldone">🎉 Done for the day! 🎉</div>';
    html += '<div class="list">';
    if (!list.length) html += '<div class="empty">No chores today 😎</div>';
    list.forEach(function (c, ri) {
      var f = (!tvView && focus.c === ci && focus.r === ri) ? ' focus' : '';
      html += '<button class="chore' + (c.done ? ' done' : '') + f + '" data-c="' + ci + '" data-r="' + ri + '">' +
        '<span class="ic">' + esc(c.icon) + '</span><span class="nm">' + esc(c.name) + '</span>' +
        '<span class="val money">' + money(c.value) + '</span><span class="ck">' + (c.done ? '✓' : '') + '</span></button>';
    });
    html += '</div><div class="bank">' +
      '<div class="wk"><small>This week</small><b class="money">' + money(k.pending) + '</b></div>' +
      '<div class="sv"><small>💰 Savings</small><b class="money">' + money(k.savings) + '</b></div>' +
      '<div class="sp"><small>🛍️ Spending</small><b class="money">' + money(k.spending) + '</b></div></div></section>';
  });
  el.innerHTML = html + '</div>';
  var f = el.querySelector('.chore.focus');
  if (f && f.scrollIntoView) f.scrollIntoView({block: 'nearest'});
}

function bindTvClicks() {
  if (tvClicksBound) return;
  tvClicksBound = true;
  document.getElementById('tv').addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('[data-back]')) { closeTvView(); return; }
    var b = e.target.closest ? e.target.closest('.chore') : null;
    if (!b) return;
    focus.c = +b.dataset.c; focus.r = +b.dataset.r;
    tvToggle(focus.c, focus.r);
  });
  document.getElementById('party').addEventListener('click', closeParty);
}

function openTvView() {
  tvView = true;
  bindTvClicks();
  document.getElementById('parent').className = 'hidden';
  document.getElementById('tv').className = 'phonetv';
  document.getElementById('party').classList.add('phonetv');
  renderTV();
  window.scrollTo(0, 0);
}
function closeTvView() {
  tvView = false;
  document.getElementById('tv').className = 'hidden';
  document.getElementById('party').classList.remove('phonetv');
  document.getElementById('parent').className = '';
  renderParent();
  window.scrollTo(0, 0);
}

function clampFocus() {
  if (!S.kids.length) return;
  focus.c = Math.max(0, Math.min(focus.c, S.kids.length - 1));
  var len = todayChores(S.kids[focus.c]).length;
  focus.r = len ? Math.max(0, Math.min(focus.r, len - 1)) : 0;
}

function moveFocus(dc, dr) {
  if (dc) {
    var c = focus.c;
    for (var i = 0; i < S.kids.length; i++) {          // skip kids with no chores today
      c = (c + dc + S.kids.length) % S.kids.length;
      if (todayChores(S.kids[c]).length) break;
    }
    focus.c = c;
  }
  if (dr) focus.r += dr;
  clampFocus();
  paintFocus();
}

function paintFocus() {
  var old = document.querySelector('#tv .chore.focus');
  if (old) old.classList.remove('focus');
  if (tvView) return;
  var el = document.querySelector('#tv .chore[data-c="' + focus.c + '"][data-r="' + focus.r + '"]');
  if (el) { el.classList.add('focus'); if (el.scrollIntoView) el.scrollIntoView({block: 'nearest'}); }
}

function tvToggle(ci, ri) {
  var k = S.kids[ci]; if (!k) return;
  var c = todayChores(k)[ri]; if (!c) return;
  var wasAll = allDone(k);
  c.done = !c.done;                                   // optimistic
  k.pending = Math.round((k.pending + (c.done ? c.value : -c.value)) * 100) / 100;
  renderTV();
  if (!wasAll && allDone(k)) celebrate(k);
  pending++;
  call('toggleChore', k.id, c.id).then(function (st) {
    pending--;
    if (pending === 0) applyState(st);      // newer taps win; only take the server copy once all are saved
  }).catch(function (e) { pending--; toast(errMsg(e)); refresh(true); });
}

function celebrate(k) {
  var p = document.getElementById('party');
  p.innerHTML = '<div class="big">🏆</div><h3>Way to go, ' + esc(k.name) + '!</h3>' +
    '<p>All your chores are done for today ⭐ You earned ' + money(earnedToday(k)) + '</p>';
  p.className = tvView ? 'phonetv' : '';
  var emojis = ['⭐', '🌟', '✨', '⭐', '💫'];
  for (var i = 0; i < (MODE === 'tv' ? 22 : 40); i++) {
    var s = document.createElement('div');
    s.className = 'fall';
    s.textContent = emojis[i % emojis.length];
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.fontSize = (2 + Math.random() * 4) + 'vw';
    s.style.animationDuration = (2.5 + Math.random() * 3) + 's';
    s.style.animationDelay = (Math.random() * 2.5) + 's';
    p.appendChild(s);
  }
  clearTimeout(celebrate._t);
  celebrate._t = setTimeout(closeParty, 9000);
}
function closeParty() { document.getElementById('party').className = 'hidden' + (tvView ? ' phonetv' : ''); }

function tvKeys(e) {
  var k = e.key, code = e.keyCode;
  var partyOpen = !document.getElementById('party').classList.contains('hidden');
  if (partyOpen) { closeParty(); e.preventDefault(); return; }
  if (k === 'ArrowRight' || code === 39) { moveFocus(1, 0); }
  else if (k === 'ArrowLeft' || code === 37) { moveFocus(-1, 0); }
  else if (k === 'ArrowDown' || code === 40) { moveFocus(0, 1); }
  else if (k === 'ArrowUp' || code === 38) { moveFocus(0, -1); }
  else if (k === 'Enter' || k === ' ' || code === 13 || code === 23 || code === 32) { tvToggle(focus.c, focus.r); }
  else return;
  e.preventDefault();
}

function startTV() {
  document.getElementById('tv').className = '';
  document.body.style.overflow = 'hidden';
  // start on the first kid that has chores
  for (var i = 0; i < S.kids.length; i++) if (todayChores(S.kids[i]).length) { focus.c = i; break; }
  renderTV();
  document.addEventListener('keydown', tvKeys);
  bindTvClicks();
  try { window.focus(); } catch (e) {}
  // pick up changes made from phones, and roll over at midnight
  setInterval(refresh, 30000);
}

function applyState(st) {
  var j = JSON.stringify(st);
  if (j === lastJson && S) return;          // nothing changed: leave the screen alone
  lastJson = j; S = st;
  if (MODE === 'tv' || tvView) { clampFocus(); renderTV(); } else renderParent();
}
function refresh(force) {
  if (busy || pending) return;
  if (force) lastJson = '';
  call('getState').then(function (st) { if (!pending) applyState(st); }).catch(function () {});
}

// ======================================================
// PARENT (phone)
// ======================================================
var PIN = null, tab = 'kids';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function startParent() {
  document.getElementById('parent').className = '';
  var saved = lsGet('chorePin');
  var cached = null;
  try { cached = JSON.parse(lsGet('choreState') || 'null'); } catch (x) {}
  if (saved && cached && cached.kids) { PIN = saved; S = cached; renderParent(); }   // show last screen instantly
  if (saved) {
    call('parent', saved, 'check').then(function (st) { PIN = saved; lastJson = ''; applyState(st); cacheState(); })
      .catch(function (e) { if (!S || /PIN/.test(errMsg(e))) showPin(); else toast(errMsg(e)); });
  } else showPin();
  setInterval(function () { if (PIN && document.getElementById('modal').className === 'hidden') refresh(); }, 30000);
}

function showPin(msg) {
  document.getElementById('parent').innerHTML = '<div class="pinbox"><h1>👨‍👩‍👧‍👦 Parent Mode</h1>' +
    '<div class="sub">' + (msg || 'Enter your PIN') + '</div>' +
    '<input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">' +
    '<button class="btn pri full" id="pinGo">Unlock</button></div>';
  var go = function () {
    var v = document.getElementById('pin').value;
    call('parent', v, 'check').then(function (st) { PIN = v; lsSet('chorePin', v); S = st; renderParent(); })
      .catch(function (e) { showPin(errMsg(e)); });
  };
  document.getElementById('pinGo').onclick = go;
  document.getElementById('pin').onkeydown = function (e) { if (e.key === 'Enter') go(); };
}

function cacheState() { if (S) lsSet('choreState', JSON.stringify(S)); }
function round2(n) { return Math.round(n * 100) / 100; }
function runsOn(days, dow) {
  days = String(days || 'daily');
  return days.toLowerCase() === 'daily' || days.split(/[\s,]+/).indexOf(DAYS[dow]) >= 0;
}
function serverFail(e) {
  toast(errMsg(e));
  if (/PIN/.test(errMsg(e))) { lsSet('chorePin', ''); showPin(); return; }
  refresh(true);                            // put the screen back to what Google really has
}
// Update the screen right away (local), then save to Google in the background
function act(action, args, okMsg, local) {
  args = args || {};
  if (local) {
    try { local(); } catch (x) {}
    closeModal(); renderParent(); cacheState();
    if (okMsg) toast(okMsg, true);
  } else busy = true;
  pending++;
  return call('parent', PIN, action, args).then(function (st) {
    pending--; busy = false;
    if (!local) { closeModal(); if (okMsg) toast(okMsg, true); }
    if (pending === 0) { lastJson = ''; applyState(st); cacheState(); }
  }).catch(function (e) { pending--; busy = false; serverFail(e); });
}

// Replace every kid's chores with the recommended list (runs a few saves at a time)
function loadPreset() {
  var jobs = [];
  S.kids.forEach(function (k) {
    k.chores.forEach(function (c) { if (String(c.id).indexOf('tmp') !== 0) jobs.push(['deleteChore', {id: c.id}]); });
    var list = PRESET[k.id] || [];
    k.chores = list.map(function (p, i) {
      return {id: 'tmp' + k.id + i, name: p[0], icon: p[1], value: p[2], days: p[3], active: true, done: false, today: runsOn(p[3], S.dow)};
    });
    list.forEach(function (p, i) {
      jobs.push(['saveChore', {kidId: k.id, name: p[0], icon: p[1], value: p[2], days: p[3], active: true, order: 0}]);
    });
  });
  // keep each kid's order stable: number orders by kid position then row
  var n = 0; jobs.forEach(function (j) { if (j[0] === 'saveChore') j[1].order = ++n; });
  renderParent(); cacheState();
  var total = jobs.length, doneCount = 0, failed = 0, last = null;
  pending++;
  toast('Saving chores… 0 of ' + total, true);
  // deletes first, then adds, 4 at a time
  var deletes = jobs.filter(function (j) { return j[0] === 'deleteChore'; });
  var adds = jobs.filter(function (j) { return j[0] === 'saveChore'; });
  function runBatch(list) {
    return new Promise(function (resolve) {
      var i = 0, active = 0;
      function next() {
        if (i >= list.length && active === 0) return resolve();
        while (active < 4 && i < list.length) {
          var j = list[i++]; active++;
          call('parent', PIN, j[0], j[1]).then(function (st) { last = st; })
            .catch(function () { failed++; })
            .then(function () { active--; doneCount++; toast('Saving chores… ' + doneCount + ' of ' + total, true); next(); });
        }
      }
      next();
    });
  }
  runBatch(deletes).then(function () { return runBatch(adds); }).then(function () {
    pending--;
    if (failed) toast(failed + ' chore changes didn’t save — tap the button again'); else toast('All chores loaded ⭐', true);
    lastJson = ''; refresh(true);
  });
}

function fmtHour(h) { h = Number(h); return (h % 12 || 12) + (h < 12 ? ' AM' : ' PM'); }
function daysLabel(d) {
  d = String(d || 'daily');
  if (d.toLowerCase() === 'daily') return 'every day';
  var a = d.split(/[\s,]+/).filter(Boolean);
  if (a.length === 5 && ['Mo','Tu','We','Th','Fr'].every(function (x) { return a.indexOf(x) >= 0; })) return 'weekdays';
  if (a.length === 2 && a.indexOf('Sa') >= 0 && a.indexOf('Su') >= 0) return 'weekends';
  return a.join(', ');
}

function doMoney(kind, kidId) {
  var amt = Math.abs(parseFloat(document.getElementById('mAmt').value) || 0);
  var note = document.getElementById('mNote').value;
  var bucket = document.querySelector('#seg button.on').dataset.v;
  if (!amt) { toast('Enter an amount'); return; }
  var k = kidById(kidId);
  if (kind === 'move') return act('move', {kidId: kidId, to: bucket, amount: amt, note: note}, 'Moved ' + money(amt), function () {
    var from = bucket === 'spending' ? 'savings' : 'spending';
    k[from] = round2(k[from] - amt); k[bucket] = round2(k[bucket] + amt);
    S.ledger.unshift({ts: new Date().toISOString(), kidId: kidId, type: 'move', savings: bucket === 'savings' ? amt : -amt, spending: bucket === 'spending' ? amt : -amt, note: note || 'Moved money'});
  });
  if (kind === 'spend' && amt > k[bucket] + 0.001 && !confirm(k.name + ' only has ' + money(k[bucket]) + ' in ' + bucket + '. Go negative anyway?')) return;
  var signed = kind === 'spend' ? -amt : amt, nt = note || (kind === 'spend' ? 'Spent' : 'Bonus');
  act('txn', {kidId: kidId, bucket: bucket, amount: signed, note: nt, type: kind}, 'Saved', function () {
    k[bucket] = round2(k[bucket] + signed);
    S.ledger.unshift({ts: new Date().toISOString(), kidId: kidId, type: kind, savings: bucket === 'savings' ? signed : 0, spending: bucket === 'spending' ? signed : 0, note: nt});
  });
}

// ---------- parent click router ----------
document.addEventListener('click', function (e) {
  if (MODE !== 'parent' || tvView) return;
  var t = e.target.closest ? e.target.closest('[data-act],[data-tab],#seg button') : null;
  if (!t) { if (e.target.id === 'modal') closeModal(); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; renderParent(); return; }
  if (t.parentNode && t.parentNode.id === 'seg') {
    Array.prototype.forEach.call(t.parentNode.children, function (b) { b.className = ''; });
    t.className = 'on'; return;
  }
  var a = t.dataset.act, kid = t.dataset.kid, id = t.dataset.id;
  switch (a) {
    case 'spend': case 'add': case 'move': moneyModal(a, kid); break;
    case 'doMoney': doMoney(t.dataset.kind, kid); break;
    case 'today': todayModal(kid); break;
    case 'ptoggle':
      var pk = kidById(kid), pc = pk.chores.filter(function (x) { return x.id === id; })[0];
      if (!pc) break;
      pc.done = !pc.done;
      pk.pending = round2(pk.pending + (pc.done ? pc.value : -pc.value));
      todayModal(kid); renderParent(); cacheState();
      pending++;
      call('parent', PIN, 'toggle', {kidId: kid, choreId: id}).then(function (st) {
        pending--; if (pending === 0) { lastJson = ''; applyState(st); cacheState(); if (document.getElementById('modal').className !== 'hidden') todayModal(kid); }
      }).catch(function (err) { pending--; serverFail(err); });
      break;
    case 'payday':
      if (confirm('Pay out everything earned this week now? It will split into Savings and Spending.')) act('payday', {}, 'Paid out!', function () {
        S.kids.forEach(function (pk2) {
          if (pk2.pending <= 0) return;
          var sv = round2(pk2.pending * pk2.savingsPct / 100), sp = round2(pk2.pending - sv);
          pk2.savings = round2(pk2.savings + sv); pk2.spending = round2(pk2.spending + sp);
          S.ledger.unshift({ts: new Date().toISOString(), kidId: pk2.id, type: 'payday', savings: sv, spending: sp, note: 'Pay day: ' + money(pk2.pending)});
          pk2.pending = 0;
        });
      });
      break;
    case 'newChore': choreModal(kid); break;
    case 'editChore': choreModal(kid, id); break;
    case 'pickIcon': document.getElementById('cIcon').value = t.dataset.v; break;
    case 'day':
      var i = editDays.indexOf(t.dataset.v);
      if (i >= 0) editDays.splice(i, 1); else editDays.push(t.dataset.v);
      t.className = i >= 0 ? '' : 'on'; break;
    case 'saveChore':
      var name = document.getElementById('cName').value.trim();
      if (!name) { toast('Give the chore a name'); return; }
      if (!editDays.length) { toast('Pick at least one day'); return; }
      var days = editDays.length === 7 ? 'daily' : DAYS.filter(function (x) { return editDays.indexOf(x) >= 0; }).join(',');
      var ch = {id: id || '', kidId: kid, name: name, icon: document.getElementById('cIcon').value.trim() || '⭐',
        value: round2(parseFloat(document.getElementById('cVal').value) || 0), days: days, active: document.getElementById('cAct').checked};
      act('saveChore', ch, 'Chore saved', function () {
        var sk = kidById(kid);
        var ex = id ? sk.chores.filter(function (x) { return x.id === id; })[0] : null;
        var rec = ex || {id: 'tmp' + Date.now(), done: false};
        rec.name = ch.name; rec.icon = ch.icon; rec.value = ch.value; rec.days = ch.days; rec.active = ch.active;
        rec.today = ch.active && runsOn(ch.days, S.dow);
        if (!ex) sk.chores.push(rec);
      });
      break;
    case 'delChore':
      if (confirm('Delete this chore? (Money already earned stays.)')) act('deleteChore', {id: id}, 'Deleted', function () {
        S.kids.forEach(function (dk) { dk.chores = dk.chores.filter(function (x) { return x.id !== id; }); });
      });
      break;
    case 'savePct':
      var inputs = document.querySelectorAll('[data-pct]');
      var chain = Promise.resolve(), last = null;
      Array.prototype.forEach.call(inputs, function (inp) {
        var sk = kidById(inp.dataset.pct); if (sk) sk.savingsPct = Number(inp.value);
        chain = chain.then(function () { return call('parent', PIN, 'saveKid', {id: inp.dataset.pct, savingsPct: inp.value}); })
          .then(function (st) { last = st; });
      });
      renderParent(); cacheState(); toast('Savings split saved', true);
      pending++;
      chain.then(function () { pending--; if (pending === 0 && last) { lastJson = ''; applyState(last); cacheState(); } })
        .catch(function (err) { pending--; serverFail(err); });
      break;
    case 'savePayday':
      var pdd = +document.getElementById('pdDay').value, pdh = +document.getElementById('pdHour').value;
      act('setPayday', {day: pdd, hour: pdh}, 'Pay day saved', function () { S.settings.paydayDay = pdd; S.settings.paydayHour = pdh; });
      break;
    case 'savePin':
      var np = document.getElementById('newPin').value;
      call('parent', PIN, 'setPin', {newPin: np}).then(function (st) { PIN = np; lsSet('chorePin', np); S = st; renderParent(); toast('PIN changed', true); })
        .catch(function (err) { toast(errMsg(err)); });
      break;
    case 'lock': PIN = null; lsSet('chorePin', ''); lsSet('choreState', ''); showPin(); break;
    case 'tvview': openTvView(); break;
    case 'preset':
      if (confirm('Replace ALL current chores for every kid with our chore list? Money already earned stays.')) loadPreset();
      break;
    case 'close': closeModal(); break;
  }
});
// keep the box you're typing in visible above the phone keyboard
document.addEventListener('focusin', function (e) {
  if (MODE !== 'parent' || !/INPUT|SELECT/.test(e.target.tagName)) return;
  setTimeout(function () { try { e.target.scrollIntoView({block: 'center', behavior: 'smooth'}); } catch (x) {} }, 350);
});
document.addEventListener('input', function (e) {
  if (e.target.dataset && e.target.dataset.pct) document.getElementById('pv_' + e.target.dataset.pct).textContent = e.target.value;
});

// ---------- boot ----------
if (MODE === 'parent') {
  document.getElementById('loading').className = 'hidden';
  startParent();
} else {
  call('getState').then(function (st) {
    S = st; lastJson = JSON.stringify(st);
    document.getElementById('loading').className = 'hidden';
    startTV();
  }).catch(function (e) {
    document.getElementById('loading').textContent = 'Could not load chores: ' + errMsg(e);
    setTimeout(function () { location.reload(); }, 15000);
  });
}
</script>
</body>
</html>
